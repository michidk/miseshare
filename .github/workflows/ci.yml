name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: miseshare
          POSTGRES_USER: miseshare
          POSTGRES_PASSWORD: miseshare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miseshare -d miseshare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://miseshare:miseshare@127.0.0.1:5432/miseshare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox
      - run: bun audit --production
      - run: bun run verify:full
      - run: git diff --exit-code -- src/routeTree.gen.ts
