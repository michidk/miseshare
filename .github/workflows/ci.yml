name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: miseshare
          POSTGRES_USER: miseshare
          POSTGRES_PASSWORD: miseshare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miseshare -d miseshare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://miseshare:miseshare@127.0.0.1:5432/miseshare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run verify:full
