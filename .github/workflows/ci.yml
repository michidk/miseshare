# template: node/ci
# params:
#   name: CI
#   biome: false
#   timeout_minutes: 30
#   postgres: {db: miseshare, user: miseshare, password: miseshare}
#   browsers: [chromium, firefox]
#   verify_command: bun run verify:full
#   steps:
#     - name: Audit production dependencies
#       run: bun audit --production
#     - name: Check generated route tree
#       run: git diff --exit-code -- src/routeTree.gen.ts
# @end-orcastrate

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
 

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: miseshare
          POSTGRES_USER: miseshare
          POSTGRES_PASSWORD: miseshare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miseshare -d miseshare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://miseshare:miseshare@127.0.0.1:5432/miseshare
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox





      - name: Verify
        run: bun run verify:full



      - name: Audit production dependencies
        run: |
          bun audit --production

      - name: Check generated route tree
        run: |
          git diff --exit-code -- src/routeTree.gen.ts
