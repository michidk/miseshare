services:
  database:
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_DB: miseshare
      POSTGRES_USER: miseshare
      POSTGRES_PASSWORD: miseshare
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miseshare -d miseshare"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - miseshare-postgres:/var/lib/postgresql

volumes:
  miseshare-postgres:
