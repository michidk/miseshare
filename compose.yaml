services:
  database:
    image: postgres:19-alpine@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
    environment:
      POSTGRES_DB: miseshare
      POSTGRES_USER: miseshare
      POSTGRES_PASSWORD: miseshare
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miseshare -d miseshare"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - miseshare-postgres:/var/lib/postgresql

volumes:
  miseshare-postgres:
